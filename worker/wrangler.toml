name = "ads"
main = "index.js"
compatibility_date = "2026-04-04"

[vars]
ALLOWED_ORIGIN = "https://ads.cepat.top"
RATE_LIMIT_PER_MIN = "60"
SIGNATURE_MAX_SKEW_MS = "300000"
NONCE_TTL_SEC = "600"
AI_CACHE_TTL_SEC = "300"
WEBHOOK_MAX_SKEW_MS = "300000"
GAS_WEB_APP_URL = ""
GEMINI_MODEL = "gemini-1.5-flash"
CLAUDE_MODEL = "claude-3-5-sonnet-20241022"
MAX_IMPORT_CSV_BYTES = "2500000"
MAX_IMPORT_XLSX_B64_BYTES = "12000000"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_ID"

[[kv_namespaces]]
binding = "REPLAY_KV"
id = "REPLACE_WITH_REPLAY_KV_ID"

[[kv_namespaces]]
binding = "AI_CACHE_KV"
id = "REPLACE_WITH_AI_CACHE_KV_ID"
